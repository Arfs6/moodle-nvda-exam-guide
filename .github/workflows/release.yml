name: Build and release PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create, for example v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: pdf-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: moodle-nvda-exam-guide.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish PDF release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: moodle-nvda-exam-guide.pdf
